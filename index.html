<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8-Set Automated Dashboard</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #161616;
            --border-color: #333;
            --accent-green: #00ff41;
            --accent-blue: #00d4ff;
            --alert-red: #ff0000;
            --status-ok: #00ff41;
            --status-error: #ff4141;
            --status-wait: #ffcc00;
        }

        * {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: var(--bg-color); 
            color: white; 
            margin: 0; 
            padding: 10px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        #dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            flex-grow: 1;
            padding: 5px;
            margin-bottom: 10px;
        }

        .set-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            padding: 8px;
        }

        .set-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            margin-bottom: 8px;
        }

        .set-title { font-weight: bold; color: #aaa; font-size: 0.8rem; }
        
        .file-status-wrapper { display: flex; align-items: center; gap: 5px; margin-top: 2px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-loading { background: var(--status-wait); box-shadow: 0 0 5px var(--status-wait); }
        .dot-ok { background: var(--status-ok); box-shadow: 0 0 5px var(--status-ok); }
        .dot-error { background: var(--status-error); box-shadow: 0 0 5px var(--status-error); }
        
        .file-info { font-size: 0.65rem; color: #777; font-family: monospace; }
        .set-clock { font-family: monospace; color: var(--accent-green); font-size: 1.2rem; font-weight: bold; }

        .bars-list { display: flex; flex-direction: column; gap: 8px; flex-grow: 1; justify-content: center; }
        .bar-row {
            display: flex;
            align-items: center;
            background: #222;
            border: 1px solid #333;
            height: 45px;
            border-radius: 4px;
            padding: 0 12px;
            transition: all 0.3s;
        }

        .bar-num { width: 30px; font-weight: bold; color: #aaa; font-size: 1.1rem; }
        .bar-status { flex-grow: 1; text-align: right; font-family: monospace; font-size: 1rem; }
        .next-time { color: var(--accent-blue); font-weight: bold; }
        
        .match-flash { 
            background: var(--alert-red) !important; 
            border-color: #ff6666 !important;
            transform: scale(1.02); 
            z-index: 10;
        }

        /* --- BOTTOM LOG PANEL --- */
        #log-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            margin: 5px;
            max-height: 160px;
            display: flex;
            flex-direction: column;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            margin-bottom: 5px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #aaa;
        }

        .clear-btn {
            background: #333;
            color: #ccc;
            border: none;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .clear-btn:hover { background: #444; color: white; }

        #log-content {
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-entry {
            color: var(--accent-green);
            background: #111;
            padding: 4px 8px;
            border-left: 3px solid var(--alert-red);
            border-radius: 2px;
            font-weight: bold;
        }

        .log-empty {
            color: #555;
            font-style: italic;
        }

        /* --- RESPONSIVE MEDIA QUERIES --- */
        @media (max-width: 1024px) {
            #dashboard {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 6px;
                overflow-y: auto;
            }

            #dashboard {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .set-container { padding: 10px; }
            .set-title { font-size: 0.9rem; }
            .set-clock { font-size: 1.3rem; }
            .bar-row { height: 48px; padding: 0 14px; }
            .bar-num { font-size: 1.2rem; }
            .bar-status { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div id="dashboard"></div>

    <!-- LOG PANEL AT THE BOTTOM -->
    <div id="log-panel">
        <div class="log-header">
            <span>SIMULTANEOUS R & S TRIGGER LOG</span>
            <button class="clear-btn" onclick="clearLogs()">Clear Log</button>
        </div>
        <div id="log-content">
            <span class="log-empty">Monitoring for simultaneous R + S triggers...</span>
        </div>
    </div>

    <script>
        const clockConfigs = [
            { name: "+1", offsetHrs: 1, shiftSecs: 0 },
            { name: "+1.25", offsetHrs: 1, shiftSecs: 150 },
            { name: "+3.275", offsetHrs: 3.5, shiftSecs: -150 },
            { name: "+3.30", offsetHrs: 3.5, shiftSecs: 0 },
            { name: "+11.30", offsetHrs: 11.5, shiftSecs: 0 },
            { name: "+11.325", offsetHrs: 11.5, shiftSecs: 150 },
            { name: "+13.975", offsetHrs: 14, shiftSecs: -150 },
            { name: "+14", offsetHrs: 14, shiftSecs: 0 }
        ];

        const barLabels = ["R", "S"];
        let setEngines = [];
        let lastLoggedSecond = ""; // Prevents duplicate logging within the same second

        function getZonedTime(offsetHrs, shiftSecs) {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            return new Date(utc + (offsetHrs * 3600000) + (shiftSecs * 1000));
        }

        function getDatePrefix(date) {
            const dd = String(date.getDate()).padStart(2, '0');
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            return `${dd}${mm}`;
        }

        async function loadCSVs(engine) {
            const datePrefix = getDatePrefix(engine.currentTime);
            engine.loadedFile = `${datePrefix}-R/S.csv`;
            
            const dot = document.getElementById(`dot-${engine.id}`);
            dot.className = 'status-dot dot-loading';

            try {
                const [respR, respS] = await Promise.all([
                    fetch(`data/${datePrefix}-R.csv`),
                    fetch(`data/${datePrefix}-S.csv`)
                ]);

                let scheduleR = [];
                let scheduleS = [];

                if (respR.ok) {
                    const textR = await respR.text();
                    scheduleR = parseCSV(textR, "R");
                }
                if (respS.ok) {
                    const textS = await respS.text();
                    scheduleS = parseCSV(textS, "S");
                }

                engine.schedule = [...scheduleR, ...scheduleS];

                if (respR.ok || respS.ok) {
                    dot.className = 'status-dot dot-ok';
                } else {
                    dot.className = 'status-dot dot-error';
                }
            } catch (e) {
                engine.schedule = [];
                dot.className = 'status-dot dot-error';
            }
        }

        function parseCSV(data, barName) {
            return data.split('\n').slice(1).map(line => {
                const cols = line.split(',');
                if (cols.length < 3) return null;
                const h = cols[0].trim();
                const m = cols[1].trim();
                const s = cols[2].trim();
                if (h === '' || isNaN(h)) return null;

                return {
                    bar: barName,
                    timeStr: `${h.padStart(2,'0')}:${m.padStart(2,'0')}:${s.padStart(2,'0')}`
                };
            }).filter(item => item !== null);
        }

        function initDashboard() {
            const board = document.getElementById('dashboard');
            clockConfigs.forEach((config, i) => {
                const engine = {
                    ...config,
                    id: i,
                    currentTime: getZonedTime(config.offsetHrs, config.shiftSecs),
                    schedule: [],
                    loadedFile: ""
                };
                setEngines.push(engine);

                let barsHtml = '';
                barLabels.forEach(b => {
                    barsHtml += `
                        <div class="bar-row" id="s${i}-r${b}">
                            <div class="bar-num">${b}</div>
                            <div class="bar-status"><span class="next-time" id="s${i}-next-${b}">--:--:--</span></div>
                        </div>`;
                });

                board.innerHTML += `
                    <div class="set-container">
                        <div class="set-header">
                            <div>
                                <span class="set-title">CLOCK ${config.name}</span>
                                <div class="file-status-wrapper">
                                    <span class="status-dot dot-loading" id="dot-${i}"></span>
                                    <span class="file-info" id="file-${i}">...</span>
                                </div>
                            </div>
                            <span class="set-clock" id="clock-${i}">00:00:00</span>
                        </div>
                        <div class="bars-list">${barsHtml}</div>
                    </div>`;
                
                loadCSVs(engine);
            });
            setInterval(masterTick, 1000);
        }

        function masterTick() {
            const systemTimeStr = new Date().toTimeString().split(' ')[0];
            let activeRClocks = [];
            let activeSClocks = [];

            setEngines.forEach(set => {
                const prevDate = set.currentTime.getDate();
                set.currentTime = getZonedTime(set.offsetHrs, set.shiftSecs);
                const nowStr = set.currentTime.toTimeString().split(' ')[0];
                
                if (set.currentTime.getDate() !== prevDate) {
                    loadCSVs(set);
                }

                document.getElementById(`clock-${set.id}`).innerText = nowStr;
                document.getElementById(`file-${set.id}`).innerText = set.loadedFile;

                barLabels.forEach(b => {
                    const rowEl = document.getElementById(`s${set.id}-r${b}`);
                    const nextEl = document.getElementById(`s${set.id}-next-${b}`);

                    const isMatch = set.schedule.some(item => item.bar === b && item.timeStr === nowStr);
                    
                    if (isMatch) {
                        rowEl.classList.add('match-flash');
                        setTimeout(() => rowEl.classList.remove('match-flash'), 2000);
                        
                        if (b === "R") activeRClocks.push(set.name);
                        if (b === "S") activeSClocks.push(set.name);
                    }

                    const upcoming = set.schedule
                        .filter(item => item.bar === b && item.timeStr > nowStr)
                        .sort((a, b) => a.timeStr.localeCompare(b.timeStr))[0];

                    nextEl.innerText = upcoming ? upcoming.timeStr : "DONE";
                });
            });

            // STRICT DUAL TRIGGER: Logs ONLY when at least one R and at least one S blink simultaneously
            if (activeRClocks.length > 0 && activeSClocks.length > 0 && lastLoggedSecond !== systemTimeStr) {
                lastLoggedSecond = systemTimeStr;

                let rText = `R (${activeRClocks.join(', ')})`;
                let sText = `S (${activeSClocks.join(', ')})`;
                
                let logStr = `${rText} ${sText} @ ${systemTimeStr}`;
                addLogEntry(logStr);
            }
        }

        function addLogEntry(message) {
            const logContent = document.getElementById('log-content');
            const emptyLabel = logContent.querySelector('.log-empty');
            if (emptyLabel) {
                emptyLabel.remove();
            }

            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerText = message;

            logContent.insertBefore(entry, logContent.firstChild);
        }

        function clearLogs() {
            const logContent = document.getElementById('log-content');
            logContent.innerHTML = '<span class="log-empty">Monitoring for simultaneous R + S triggers...</span>';
            lastLoggedSecond = "";
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
